name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          bash -n bc setup.sh cu-test.sh game.sh reset.sh lib/*.sh
          python3 -m py_compile helpers/*.py

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            test "$tag" = "v$version"
          else
            tag="v$version"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
            if [[ -z "$existing" ]]; then
              git tag "$tag" "$GITHUB_SHA"
              git push origin "$tag"
            elif [[ "$existing" != "$GITHUB_SHA" ]]; then
              # Safe only before a release exists: move an unpublished tag to
              # the exact commit whose runtime is being signed and published.
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "Release $tag already exists; refusing to move its tag." >&2
                exit 1
              fi
              git tag -f "$tag" "$GITHUB_SHA"
              git push --force origin "$tag"
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already published."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        if: steps.prep.outputs.release_exists != 'true'
        uses: sigstore/cosign-installer@v3

      - name: Build release archive
        if: steps.prep.outputs.release_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod 0755 bc setup.sh cu-test.sh game.sh reset.sh lib/*.sh helpers/*.py
          tar --zstd -cf bc250-framework.tar.zst \
            VERSION bc setup.sh cu-test.sh game.sh reset.sh lib helpers
          sha="$(sha256sum bc250-framework.tar.zst | awk '{print $1}')"
          version="$(cat VERSION)"
          python3 - "$version" "$sha" <<'PY'
          import json, sys
          version, sha = sys.argv[1:]
          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump({
                  "schema_version": 1,
                  "version": version,
                  "sha256": sha,
                  "asset": "bc250-framework.tar.zst"
              }, f, indent=2)
              f.write("\n")
          PY

      - name: Sign release archive
        if: steps.prep.outputs.release_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle bc250-framework.cosign.bundle \
            bc250-framework.tar.zst

      - name: Publish GitHub release
        if: steps.prep.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prep.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --verify-tag \
            --title "BC250 Framework $TAG" \
            --generate-notes \
            bc250-framework.tar.zst \
            bc250-framework.cosign.bundle \
            manifest.json
